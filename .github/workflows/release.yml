# Every push to main and every pull request (e.g. from Dependabot) is tested, in Firefox and Chrome. A tag like v2026.11.10.1834 on main is also submitted to addons.mozilla.org and the Chrome Web Store.

name: Release

on:
  push:
    branches: [main]
    tags: ['v[0-9]*']
  pull_request:
  # Started on a tag by dependabot.yml, whose tag push alone would start nothing.
  workflow_dispatch:

permissions:
  contents: read

# Tools Dependabot can't update; the lockfile job warns once a newer release is 7 days old.
env:
  GH_ACTIONS_LOCK_VERSION: v0.4.1
  ZIZMOR_VERSION: 1.32.0

jobs:
  # actions.lock must match the workflows and every locked pin must still verify upstream.
  # After changing a `uses:` line, run `gh actions-lock` and commit the lockfile.
  lockfile:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin "$GH_ACTIONS_LOCK_VERSION"
      - run: gh actions-lock --verify
      # The same 7 days as the cooldown in .github/dependabot.yml.
      - name: Warn about outdated tool versions
        run: |
          check() {
            read -r tag date <<<"$(gh api "repos/$1/releases/latest" --jq '.tag_name + " " + .published_at')"
            if [ "$tag" != "$2" ] && [ "$(date -d "$date" +%s)" -lt "$(date -d '7 days ago' +%s)" ]; then
              echo "::warning::$1 $tag is out since $date, release.yml pins $2."
            fi
          }
          check github/gh-actions-lock "$GH_ACTIONS_LOCK_VERSION"
          check zizmorcore/zizmor "v$ZIZMOR_VERSION"

  # Security audit of the workflows, see https://docs.zizmor.sh. Findings fail the job.
  zizmor:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@v0.8.1
        with:
          version: ${{ env.ZIZMOR_VERSION }}
          advanced-security: false

  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # The AMO keys live in the environment amo, which only v* tags may use; everything else runs without one.
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'amo' || '' }}
    env:
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # No npm cache for a release: what is submitted is built from a clean install only.
      # zizmor can't evaluate the cache expression, hence the ignore.
      - uses: actions/setup-node@v7.1.0 # zizmor: ignore[cache-poisoning]
        with:
          node-version: 26
          cache: ${{ env.RELEASE != 'true' && 'npm' || '' }}
          package-manager-cache: false
      - run: npm ci

      - name: Take the version from the tag
        if: env.RELEASE == 'true'
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          echo "FIREDIAL_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - run: npm test

      # Mutation testing: the unit tests must notice changed logic, see stryker.config.json for the bar.
      # Incremental: results of the last run are reused, only mutants in changed code or under changed tests run again.
      # A tag runs everything once more before it is released.
      - uses: actions/cache/restore@v6.1.0
        if: env.RELEASE != 'true'
        with:
          path: reports/stryker-incremental.json
          key: stryker-${{ github.sha }}
          restore-keys: stryker-
      - id: mutate
        run: npm run mutate
      - uses: actions/cache/save@v6.1.0
        if: always() && steps.mutate.outcome != 'skipped' && hashFiles('reports/stryker-incremental.json') != ''
        with:
          path: reports/stryker-incremental.json
          key: stryker-${{ github.sha }}

      # Listed versions need review, usually automatic. Waiting for it could outlast this job, so submit and finish.
      - name: Submit to addons.mozilla.org
        if: env.RELEASE == 'true'
        run: |
          git ls-files -z | xargs -0 zip -q firedial-source.zip
          npx web-ext sign --source-dir dist/firefox --channel listed --amo-metadata browsers/publishing/amo-metadata.json --upload-source-code firedial-source.zip --approval-timeout 0
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_API_SECRET }}

  # The Chrome Web Store's keys live in the environment chrome-web-store, which only v* tags may
  # use. Runs once the release job tested the tag, builds it the same way and submits it for review.
  chrome-web-store:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: chrome-web-store
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          package-manager-cache: false
      - run: npm ci
      - run: FIREDIAL_VERSION="${GITHUB_REF_NAME#v}" npm run build
      - run: npx chrome-webstore-upload --source dist/chrome
        env:
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
