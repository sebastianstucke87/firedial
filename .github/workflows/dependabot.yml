# Runs after the tests of a pull request pass. A Dependabot patch or minor update is merged.
# If the merge changed the built add-on, it is tagged with a new version and released to
# addons.mozilla.org and the Chrome Web Store through release.yml. Releasing only happens while the repository
# variable AMO_RELEASES is 'true', and only after a first release was tagged by hand.

name: Dependabot

on:
  # Runs no pull request code: merge checks author, state and tested commit through the API, compare builds the merged commit on main.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [Release]
    types: [completed]

permissions: {}

concurrency: dependabot

jobs:
  merge:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    outputs:
      sha: ${{ steps.merge.outputs.sha }}
    steps:
      - id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          [ -n "$PR" ] || { echo 'No pull request.'; exit 0; }
          pr=$(gh api "repos/$REPO/pulls/$PR" --jq '[.user.login, .state, .head.sha] | join(" ")')
          [ "$pr" = "dependabot[bot] open $SHA" ] || { echo "Not an open Dependabot pull request at the tested commit: $pr"; exit 0; }
          message=$(gh api "repos/$REPO/commits/$SHA" --jq .commit.message)
          if ! grep -q 'update-type: version-update:semver-' <<<"$message" || grep -q 'semver-major' <<<"$message"; then
            echo 'Not a patch or minor update: left open for review.'
            exit 0
          fi
          gh pr merge "$PR" --repo "$REPO" --squash --delete-branch --match-head-commit "$SHA"
          echo "sha=$(gh api "repos/$REPO/pulls/$PR" --jq .merge_commit_sha)" >> "$GITHUB_OUTPUT"

  # Builds the merged commit and the last release with the same version, so only real changes count.
  compare:
    needs: merge
    if: needs.merge.outputs.sha != '' && vars.AMO_RELEASES == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.merge.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: npm
      - id: compare
        run: |
          last=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 1)
          if [ -z "$last" ]; then
            echo 'No release yet: the first one is tagged by hand.'
            echo changed=false >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm ci && FIREDIAL_VERSION=0 npm run build
          mv dist "$RUNNER_TEMP/new"
          git worktree add "$RUNNER_TEMP/old" "$last"
          (cd "$RUNNER_TEMP/old" && npm ci && FIREDIAL_VERSION=0 npm run build)
          if diff -r "$RUNNER_TEMP/old/dist" "$RUNNER_TEMP/new"; then
            echo "The add-on is the same as in $last: no release."
            echo changed=false >> "$GITHUB_OUTPUT"
          else
            echo changed=true >> "$GITHUB_OUTPUT"
          fi

  # A tag pushed with this workflow's token starts no workflow, so release.yml is started by hand.
  release:
    needs: [merge, compare]
    if: needs.compare.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.merge.outputs.sha }}
        run: |
          # The same version scheme as scripts/build.ts: YYYY.M.D.HHMM without leading zeros.
          read -r year month day time <<<"$(date -u '+%Y %-m %-d %H%M')"
          tag="v$year.$month.$day.$((10#$time))"
          gh api "repos/$REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$SHA" >/dev/null
          gh workflow run release.yml --repo "$REPO" --ref "$tag"
          echo "Tagged $tag and started the release."
